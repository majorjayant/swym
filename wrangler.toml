name = "swym"
main = "src/worker.js"
compatibility_date = "2025-01-01"

[assets]
directory = "./site"
binding = "ASSETS"
run_worker_first = true

# Worker routes. "*mrbestcars.ca/*" (no dot after the *) matches the bare
# domain AND every subdomain such as www. "*.mrbestcars.ca/*" would miss the
# bare domain. Each hostname needs a proxied (orange-cloud) DNS record.
routes = [
  { pattern = "*mrbestcars.ca/*",  zone_name = "mrbestcars.ca" },
  { pattern = "*mrbestcars.com/*", zone_name = "mrbestcars.com" },
]
