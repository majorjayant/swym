<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Branch Vision — Who Watches the AI? An AI Governance Assignment</title>
<link rel="icon" type="image/png" href="/protiviti/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,700;1,9..144,400&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0f1626;        /* deep blue-black base */
  --panel:#182238;      /* graphite console panel */
  --panel2:#1f2b45;
  --line:#34435f;
  --brass:#c9a24a;      /* brass linework */
  --signal:#e08a2e;     /* alert amber */
  --paper:#e9e4d6;      /* warm phosphor text */
  --paper-dim:#a9a596;
  --red:#c2493c;
  --green:#4e8f6e;
  --blue:#5b86c9;
  --sheet:#f3efe6;      /* light working-page background */
  --sheet-line:#d9d2c2;
  --sheet-ink:#1a2233;
  --sheet-dim:#5b6479;
  --serif:'Fraunces', Georgia, 'Times New Roman', serif;
  --sans:'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif;
  --rail:220px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto} *{animation:none!important;transition:none!important}}
body{margin:0;overflow-x:hidden;background:var(--ink);color:var(--paper);font-family:var(--sans);font-size:17px;line-height:1.55;}
a{color:var(--brass)}
h1,h2,h3,h4{font-family:var(--serif);font-weight:500;line-height:1.12;margin:0 0 .5em}
h1{font-size:clamp(2.6rem,5.5vw,4.8rem);letter-spacing:-.01em}
h2{font-size:clamp(1.9rem,3.2vw,2.8rem)}
h3{font-size:1.45rem}
h4{font-size:1.1rem;font-family:var(--sans);font-weight:600}
p{max-width:68ch;margin:0 0 1em}
.lede{font-family:var(--serif);font-size:1.35rem;font-weight:300;line-height:1.4;max-width:60ch}
.dim{color:var(--paper-dim)}
small,.small{font-size:.86rem}
strong{font-weight:600}
code{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:.9em}

/* rail */
.rail{position:fixed;left:0;top:0;bottom:0;width:var(--rail);border-right:1px solid var(--line);background:var(--ink);padding:26px 18px;overflow:auto;z-index:20}
.rail .brand{font-family:var(--serif);font-size:1.05rem;line-height:1.2;margin-bottom:22px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.rail .brand span{display:block;font-family:var(--sans);font-size:.78rem;color:var(--paper-dim);margin-top:6px}
.rail a{display:block;color:var(--paper-dim);text-decoration:none;font-size:.86rem;padding:5px 8px;border-left:2px solid transparent;margin-left:-8px}
.rail a:hover,.rail a.on{color:var(--paper);border-left-color:var(--brass)}
.rail .act{margin:14px 0 4px;font-size:.72rem;color:var(--brass);letter-spacing:.04em}
.rail a.uc{padding-left:18px}
.rail a:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.rail-toggle{display:none}
main{margin-left:var(--rail)}
@media (max-width:980px){
  .rail{transform:translateX(-100%);transition:transform .2s}
  .rail.open{transform:none}
  main{margin-left:0}
  .rail-toggle{display:block;position:fixed;left:12px;top:12px;z-index:30;background:var(--panel);color:var(--paper);border:1px solid var(--line);border-radius:4px;padding:8px 12px;font:inherit}
}

/* sections */
section{padding:88px 64px;border-bottom:1px solid var(--line);position:relative}
section.sheet{background:var(--sheet);color:var(--sheet-ink)}
section.sheet .dim{color:var(--sheet-dim)}
section.sheet a{color:#8a6a1c}
.wrap{max-width:1180px}
.eyebrow{font-size:.85rem;color:var(--brass);margin-bottom:14px}
section.sheet .eyebrow{color:#8a6a1c}
.cols{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:start}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
@media (max-width:1100px){.cols,.cols3{grid-template-columns:1fr}section{padding:64px 28px}}

/* hero */
.hero{min-height:100vh;display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:40px;padding:80px 64px;border-bottom:1px solid var(--line);overflow:hidden}
.hero .aperture{width:100%;max-width:560px;justify-self:center}
.hero .facts{display:flex;gap:36px;margin-top:34px;flex-wrap:wrap}
.hero .facts div{font-family:var(--serif);font-size:2rem;line-height:1}
.hero .facts small{display:block;font-family:var(--sans);font-size:.8rem;color:var(--paper-dim);margin-top:8px}
@media (max-width:1100px){.hero{grid-template-columns:1fr;padding:80px 28px}}

/* ledger rows (used instead of cards) */
.ledger{border-top:1px solid var(--line);margin:22px 0}
.ledger .row{display:grid;grid-template-columns:200px 1fr;gap:20px;padding:12px 0;border-bottom:1px solid var(--line);align-items:baseline}
.ledger .row b{font-weight:600;color:var(--brass)}
section.sheet .ledger,section.sheet .ledger .row{border-color:var(--sheet-line)}
section.sheet .ledger .row b{color:#8a6a1c}
.ledger.tight .row{grid-template-columns:150px 1fr}

/* rupee strip */
.money{display:flex;gap:0;border:1px solid var(--brass);margin:26px 0;flex-wrap:wrap}
.money div{flex:1 1 160px;padding:14px 18px;border-right:1px solid var(--brass)}
.money div:last-child{border-right:0}
.money b{display:block;font-family:var(--serif);font-size:1.6rem;font-weight:500}
.money small{color:var(--paper-dim)}
section.sheet .money small{color:var(--sheet-dim)}

/* tables */
table{border-collapse:collapse;width:100%;font-size:.92rem}
@media (max-width:760px){
  .wrap table{display:block;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}
  .wrap table td,.wrap table th{white-space:normal;min-width:110px}
  .money div{flex:1 1 100%;border-right:0;border-bottom:1px solid var(--brass)}
  .money div:last-child{border-bottom:0}
  .uc-open .id{font-size:4rem;right:24px}
  .ledger .row,.ledger.tight .row{grid-template-columns:1fr;gap:4px}
  svg{max-width:100%;height:auto}
}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--brass);font-size:.82rem}
section.sheet th,section.sheet td{border-color:var(--sheet-line)}
section.sheet th{color:#8a6a1c}
tr:hover td{background:rgba(201,162,74,.06)}

/* badges */
.tag{display:inline-block;font-size:.74rem;padding:2px 8px;border:1px solid currentColor;border-radius:2px;margin-right:6px;line-height:1.5}
.tier-Critical{color:#ff8b7f}.tier-High{color:var(--signal)}.tier-Moderate{color:#8fb4ec}.tier-Low{color:#8ccca9}
section.sheet .tier-Critical{color:var(--red)}section.sheet .tier-High{color:#b3641a}section.sheet .tier-Moderate{color:#2f5aa8}section.sheet .tier-Low{color:#2e7a52}
.speed-instant{color:var(--brass)}.speed-minutes{color:#b5b0a0}.speed-overnight{color:#8fb4ec}
section.sheet .speed-instant{color:#8a6a1c}section.sheet .speed-minutes{color:#5b6479}

/* use-case chapters */
.uc-open{background:radial-gradient(ellipse at 70% 40%,#22304f 0%,var(--ink) 60%);min-height:60vh}
.uc-open .id{font-family:var(--serif);font-size:7rem;font-weight:300;line-height:.9;color:var(--brass);opacity:.35;position:absolute;right:64px;top:40px}
.uc-open .incident{border-left:2px solid var(--signal);padding:10px 18px;margin:26px 0;max-width:62ch;font-family:var(--serif);font-size:1.15rem;font-weight:300;font-style:italic}
.uc-open .incident small{display:block;font-style:normal;font-family:var(--sans);color:var(--paper-dim);margin-top:8px}
.uc-body h3{margin-top:34px}
.scorecard{border:1px solid var(--sheet-line);padding:18px 20px;background:#fff}
.scorecard table td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--sheet-line);position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;background:#8a6a1c}
.ku{display:grid;grid-template-columns:1fr auto;gap:6px 14px;font-size:.92rem}
.ku span{padding:2px 10px;font-size:.78rem;border-radius:2px;color:#fff}
.ku .Known{background:var(--green)}.ku .Partial{background:var(--signal)}.ku .Unknown{background:var(--red)}
.hitl{display:flex;gap:10px;align-items:stretch;margin:14px 0;flex-wrap:wrap}
.hitl div{flex:1 1 120px;border:1px solid var(--sheet-line);padding:10px 12px;font-size:.88rem;background:#fff;position:relative}
.hitl div.human{border-color:#8a6a1c;background:#fbf4e3}
.hitl div::after{content:'→';position:absolute;right:-14px;top:40%;color:#8a6a1c}
.hitl div:last-child::after{content:''}
.callout{border:1px solid #8a6a1c;padding:16px 20px;margin:22px 0;background:#fbf4e3;max-width:72ch}
.callout b{font-family:var(--serif);font-weight:500;font-size:1.1rem;display:block;margin-bottom:6px}
.floorplan{width:100%;max-width:520px}

/* control tower */
.tower{background:#0b111e}
.console{border:1px solid var(--line);background:var(--panel);margin-top:26px}
.console .tabs{display:flex;border-bottom:1px solid var(--line);flex-wrap:wrap}
.console .tabs button{background:none;border:0;border-right:1px solid var(--line);color:var(--paper-dim);padding:12px 18px;font:inherit;font-size:.9rem;cursor:pointer}
.console .tabs button.on{color:var(--paper);background:var(--panel2);box-shadow:inset 0 -2px 0 var(--brass)}
.console .tabs button:focus-visible{outline:2px solid var(--brass);outline-offset:-2px}
.console .pane{display:none;padding:22px 24px;min-height:520px}
.console .pane.on{display:block}
.console h3{font-size:1.25rem;margin-bottom:4px}
.console .sub{color:var(--paper-dim);font-size:.9rem;margin-bottom:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media (max-width:1000px){.grid2,.grid3{grid-template-columns:1fr}}
.readout{border:1px solid var(--line);padding:12px 14px;background:var(--ink)}
.readout b{display:block;font-family:var(--serif);font-size:1.9rem;font-weight:500;line-height:1.1}
.readout small{color:var(--paper-dim)}
.readout.warn b{color:var(--signal)}.readout.bad b{color:#ff8b7f}.readout.ok b{color:#8ccca9}
label.ctl{display:block;font-size:.85rem;color:var(--paper-dim);margin:10px 0 4px}
input[type=range]{width:100%;accent-color:var(--brass)}
select,button.btn{background:var(--ink);color:var(--paper);border:1px solid var(--line);padding:8px 10px;font:inherit;font-size:.9rem}
button.btn{cursor:pointer;border-color:var(--brass);color:var(--brass)}
button.btn:hover{background:var(--brass);color:var(--ink)}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.vars{display:grid;grid-template-columns:1fr 1fr;gap:4px 22px}
.vars label{display:grid;grid-template-columns:1fr 34px;align-items:center;font-size:.86rem;color:var(--paper-dim)}
.vars label b{color:var(--paper);font-weight:500;text-align:right}
.vars input{grid-column:1/3}
.matrix td.y{color:#8ccca9}.matrix td.n{color:#4a5670}
.matrix td.e{cursor:pointer}
.gate{border:1px solid var(--line);padding:14px 16px;margin-bottom:12px;background:var(--ink)}
.gate h4{margin:0 0 6px}
.gate label{display:block;font-size:.88rem;padding:4px 0;color:var(--paper-dim);cursor:pointer}
.gate label input{margin-right:8px;accent-color:var(--brass)}
.gate .status{float:right;font-size:.8rem}
.steps{list-style:none;padding:0;margin:0}
.steps li{padding:10px 12px;border-left:2px solid var(--line);margin-left:6px;color:var(--paper-dim);font-size:.92rem}
.steps li.done{border-left-color:var(--brass);color:var(--paper)}
.steps li.now{border-left-color:var(--signal);color:var(--paper);background:rgba(224,138,46,.08)}
.gauge{height:10px;background:#0f1626;border:1px solid var(--line);position:relative}
.gauge i{position:absolute;left:0;top:0;bottom:0;background:var(--brass)}
.gauge.bad i{background:var(--red)}
.detail{border:1px solid var(--brass);padding:16px 18px;margin-top:16px;background:var(--ink)}
.detail h4{margin-top:0}
.kbd{border:1px solid var(--line);padding:0 6px;border-radius:3px;font-size:.8rem;color:var(--paper-dim)}
figure{margin:24px 0}
figcaption{font-size:.85rem;color:var(--paper-dim);margin-top:8px;max-width:70ch}
section.sheet figcaption{color:var(--sheet-dim)}
svg text{font-family:var(--sans)}
.principles{list-style:none;padding:0;margin:20px 0;counter-reset:p}
.principles li{font-family:var(--serif);font-size:1.5rem;font-weight:300;padding:12px 0;border-bottom:1px solid var(--line);counter-increment:p}
.principles li::before{content:counter(p);color:var(--brass);font-size:1rem;margin-right:16px;font-family:var(--sans)}
footer{padding:40px 64px;color:var(--paper-dim);font-size:.85rem}
.notice{font-size:.8rem;color:var(--paper-dim);border:1px dashed var(--line);padding:8px 12px;display:inline-block;margin-top:10px}
</style>
</head>

function apertureSVG(){

    const xi=r*Math.cos(a1), yi=r*Math.sin(a1);
    blades+=`<path d="M${x0.toFixed(1)},${y0.toFixed(1)} A${R},${R} 0 0,1 ${x1.toFixed(1)},${y1.toFixed(1)} L${xi.toFixed(1)},${yi.toFixed(1)} Z" fill="rgba(201,162,74,.05)" stroke="var(--brass)" stroke-width="1" opacity=".6"/>`;

function tower(){

  /* registry */
  function drawReg(){
    const t=$('#fTier').value,sp=$('#fSpeed').value,th=$('#fTheme').value;

    $('#regTable').innerHTML=`<table><thead><tr><th>System ID</th><th>Use case</th><th>Owner</th><th>Tier</th><th>Speed</th><th>Status</th><th>Next review</th></tr></thead><tbody>
    ${rows.map(u=>`<tr class="matrix"><td class="e" data-uc="${u.id}" style="color:var(--brass)">AI-BV-UC${u.id}-001</td><td class="e" data-uc="${u.id}">${u.name}</td><td class="small">${u.theme==='people'?'Branch Ops + HR':(u.theme==='safety'?'Security':(u.theme==='compliance'?'Compliance':'Branch Security'))}</td><td class="tier-${u.tier}">${u.tier}</td><td class="speed-${u.speed}">${u.speed}</td><td>${u.gate.startsWith('Gate 1')?'In qualification':'Proposed'}</td><td class="small dim">${u.tier==='Critical'?'Monthly':(u.tier==='High'?'Quarterly':'Half-yearly')}</td></tr>`).join('')}
    </tbody></table>${rows.length?'':'<p class="dim">No systems match. Clear the filters.</p>'}`;
    document.querySelectorAll('#regTable .e').forEach(c=>c.onclick=()=>detail(c.dataset.uc));
  }
  function detail(id){
    const u=UC.find(x=>x.id===id),h=UCHOURS[id];
    $('#regDetail').innerHTML=`<div class="detail"><h4>AI-BV-UC${u.id}-001 · ${u.name}</h4>
    <div class="grid3">
      <div><div class="ledger tight" style="margin:0">
      <div class="row"><b>Tier</b><span class="tier-${u.tier}">${u.tier} · ${u.total}/50</span></div>
      <div class="row"><b>Models</b><span>${u.models.join(', ')}</span></div>
      <div class="row"><b>Decision role</b><span>${u.risk.decision>=4?'Influences a consequential decision':'Informs / recommends'}</span></div>
      <div class="row"><b>Autonomy</b><span>A${u.risk.autonomy} — ${u.risk.autonomy<=1?'informational':'human-approved action'}</span></div>
      </div></div>
      <div><div class="ledger tight" style="margin:0">
      <div class="row"><b>Hours</b><span>${u.hours} h</span></div>
      <div class="row"><b>Engineering</b><span>${u.eng}</span></div>
      <div class="row"><b>Per branch</b><span>${u.perBranch}</span></div>
      <div class="row"><b>Cloud</b><span>${u.cloud}</span></div>
      </div></div>
      <div><div class="ledger tight" style="margin:0">
      <div class="row"><b>Enters at</b><span>${u.gate}</span></div>
      <div class="row"><b>Alert load</b><span>${u.alertsPerDay}/branch/day · ${(u.alertsPerDay*4000).toLocaleString()} fleet</span></div>
      <div class="row"><b>Open unknowns</b><span>${u.ku.filter(k=>k[1]!=='Known').length} of ${u.ku.length}</span></div>
      <div class="row"><b>Controls</b><span>${u.controls.length} assigned</span></div>
      </div></div>
    </div>
    <p class="small dim" style="margin-top:12px"><a href="#uc${u.id}">Open the full governance chapter for UC${u.id}</a></p></div>`;
  }
  ['#fTier','#fSpeed','#fTheme'].forEach(s=>$(s).onchange=drawReg);
  $('#fClear').onclick=()=>{$('#fTier').value='';$('#fSpeed').value='';$('#fTheme').value='';drawReg();$('#regDetail').innerHTML='';};
  drawReg();

  /* risk engine */
  let cur={...UC[0].risk}, curId='01';
  function drawVars(){
    $('#engVars').innerHTML=VARS.map(v=>`<label title="${v[2]}">${v[1]}<b id="v-${v[0]}">${cur[v[0]]}</b>
      <input type="range" min="0" max="5" step="1" value="${cur[v[0]]}" data-k="${v[0]}"></label>`).join('');
    $('#engVars').querySelectorAll('input').forEach(i=>i.oninput=()=>{cur[i.dataset.k]=+i.value;$('#v-'+i.dataset.k).textContent=i.value;drawEng();});
  }
  function drawEng(){
    const tot=Object.values(cur).reduce((a,b)=>a+b,0), tier=tierOf(tot), u=UC.find(x=>x.id===curId);
    const need=CONTROLS.filter(c=>c[5]==='all'||(c[5]==='High'&&(tier==='High'||tier==='Critical'))||(c[5]==='people'&&u.theme==='people')||(c[5]==='vendor'));
    const path=tier==='Critical'?['Governance office','Model Risk independent validation','CISO + DPO','Executive AI Steering Committee']
      :tier==='High'?['Governance office','Model Risk','Business owner sign-off','AI Governance Committee']
      :tier==='Moderate'?['Governance office','Business owner sign-off']:['Governance office — fast track'];
    $('#engOut').innerHTML=`
    <div class="grid2" style="gap:14px">
      <div class="readout ${tier==='Critical'?'bad':(tier==='High'?'warn':'ok')}"><b>${tier}</b><small>tier · ${tot}/50</small></div>
      <div class="readout"><b>${need.length}</b><small>controls required</small></div>
    </div>
    <div class="gauge ${tot>=36?'bad':''}" style="margin:14px 0"><i style="width:${tot/50*100}%"></i></div>
    <p class="small dim">Assessed value for UC${u.id} is ${u.total}/50 — ${u.tier}. ${tot!==u.total?`You have moved it to ${tot} — ${tier}.`:''}</p>
    <h4 style="margin-top:16px">Approval path</h4>
    <ul class="steps">${path.map(p=>`<li class="done">${p}</li>`).join('')}</ul>
    <h4 style="margin-top:16px">Controls this tier attracts</h4>
    <div class="small dim">${need.map(c=>`<span class="tag">${c[0]}</span>`).join('')}</div>
    ${tier==='Critical'?`<div class="detail" style="margin-top:14px"><h4 style="margin:0 0 6px">Tier 4 adds</h4><p class="small" style="margin:0">Executive approval before the gate, a tested kill switch, independent validation, and a silent trial before any live consequence. In this portfolio only UC02 reaches here — and it is also the largest technical unknown in the estimate at 320 model hours.</p></div>`:''}`;
  }
  $('#engPick').onchange=e=>{curId=e.target.value;cur={...UC.find(u=>u.id===curId).risk};drawVars();drawEng();};
  $('#engReset').onclick=()=>{cur={...UC.find(u=>u.id===curId).risk};drawVars();drawEng();};
  drawVars();drawEng();

  /* controls */
  $('#ctlTable').innerHTML=`<table><thead><tr><th>ID</th><th>Control</th><th>Evidence</th><th>Owner</th><th>Frequency</th><th>Applies to</th></tr></thead><tbody>
  ${CONTROLS.map(c=>`<tr><td style="color:var(--brass)">${c[0]}</td><td>${c[1]}</td><td class="small dim">${c[2]}</td><td class="small">${c[3]}</td><td class="small">${c[4]}</td><td class="small">${c[5]==='all'?'Every system':(c[5]==='High'?'Tier 3 and 4':(c[5]==='people'?'Staff-related use cases':'Vendor models'))}</td></tr>`).join('')}
  </tbody></table>
  <p class="small dim" style="margin-top:12px">Every control names its evidence, its owner and its frequency. A control without those three is a sentence in a policy, not a control — and it cannot be tested at 4,000 branches.</p>`;

  /* gates */
  $('#gateBoxes').innerHTML=GATES.map((g,gi)=>`<div class="gate"><h4>Gate ${g.n} — ${g.name} <span class="dim" style="font-weight:400">· ${g.scope} · ${g.cost}</span><span class="status" id="gs-${gi}"></span></h4>
    ${g.gov.map((p,i)=>`<label><input type="checkbox" data-g="${gi}"> ${p}</label>`).join('')}</div>`).join('');
  function gstat(){
    GATES.forEach((g,gi)=>{
      const bs=[...document.querySelectorAll(`#gateBoxes input[data-g="${gi}"]`)], done=bs.filter(b=>b.checked).length;

      el.textContent=done===bs.length?'✓ ready to open':`${done} of ${bs.length} met`;
      el.style.color=done===bs.length?'#8ccca9':'var(--paper-dim)';
    });
  }
  document.querySelectorAll('#gateBoxes input').forEach(i=>i.onchange=gstat); gstat();

  /* money */
  function money(){
    const mp=+$('#mPrice').value, br=+$('#bCount').value, uc=+$('#uCount').value;
    const stdShare=0.85, std=Math.round(br*stdShare), enh=br-std;
    const stdBox=65500+(mp-34000), enhBox=94000+(mp-34000)*(47000/34000);
    const hw=(std*stdBox+enh*enhBox)*1.03;
    const hours=2080+Math.round(1180*(uc/10))+Math.round(1280*(uc/10));
    const engCost=hours*1205, billed=engCost*2.2;
    const y1=hw+billed+11200000*(br/4000)+1000000;
    const cr=v=>'₹'+(v/1e7).toFixed(2)+' cr';
    $('#mLab').textContent='₹'+mp.toLocaleString('en-IN');
    $('#bLab').textContent=br.toLocaleString('en-IN'); $('#uLab').textContent=uc;
    $('#moneyOut').innerHTML=`
    <div class="grid2" style="gap:14px">
      <div class="readout"><b>${cr(hw)}</b><small>hardware fleet</small></div>
      <div class="readout"><b>${cr(billed)}</b><small>engineering, billed at 2.2×</small></div>
      <div class="readout ${mp>36000?'warn':''}"><b>${cr(y1)}</b><small>year one</small></div>
      <div class="readout"><b>₹${Math.round((hw+billed)/br).toLocaleString('en-IN')}</b><small>per branch</small></div>
    </div>
    <div class="ledger tight" style="margin-top:18px">
      <div class="row"><b>Hours</b><span>${hours.toLocaleString()} — platform 2,080 never shrinks</span></div>
      <div class="row"><b>Hardware share</b><span>${(hw/y1*100).toFixed(0)}% of year one</span></div>
      <div class="row"><b>vs baseline</b><span>${y1>=311700000?'+':''}${cr(y1-311700000)} against ₹31.17 cr</span></div>
    </div>
    ${mp!==34000?`<div class="detail" style="margin-top:14px"><h4 style="margin:0 0 6px">The module assumption moved</h4><p class="small" style="margin:0">A ₹${Math.abs(mp-34000).toLocaleString('en-IN')} change per module is ${cr(Math.abs(hw-287500000))} across the fleet. This is why the unit price carries a named owner and a reassessment trigger, exactly like a vendor model version.</p></div>`:''}
    ${uc<10?`<div class="detail" style="margin-top:14px"><h4 style="margin:0 0 6px">Cutting scope barely helps</h4><p class="small" style="margin:0">Removing ${10-uc} use case${10-uc>1?'s':''} saves ${cr(HOURS.total*1205*2.2-billed)} — the platform and shared models do not shrink, and hardware is unchanged. Scope is the wrong lever; the gates are the right one.</p></div>`:''}`;
  }
  ['#mPrice','#bCount','#uCount'].forEach(s=>$(s).oninput=money); money();

  /* incident */
  const INC=[
    ["Detect","Monitoring flags the false-positive rate on UC02 at Branch 0421 — 17 alerts in two days against a baseline of one a fortnight.","Threshold breach raised automatically. No human had to notice."],
    ["Classify","AI incident · model performance · high operational impact. Tier 4 system, so the clock starts on executive notification.","Severity drives who is told and how fast."],
    ["Contain","UC02 switched to advisory mode at that branch. Police escalation was already blocked without human confirmation, so no dispatch occurred.","The kill switch is used, not debated. This is why it is tested quarterly."],
    ["Investigate","Footage reviewed. All 17 alerts trace to one camera. A replacement camera of a different model was fitted by the AMC vendor last week.","The model did not drift. The input changed."],
    ["Root cause","New camera type, different lens and colour profile, not in the validation set.","Neither an engineering failure nor a governance failure alone — a change-management gap."],
    ["Remediate","Recalibrate for the new camera type; add its footage to the validation set; retrain on the next quarterly cycle.","Every dismissed alert became a training example."],
    ["Control change","Camera-type validation added to the deployment checklist. AMC vendor now notifies before camera replacement.","The permanent fix is the control, not the retraining."],
    ["Reassess","UC02 re-qualified at the branch. Uncertainty on 'future camera models' moves from Unknown to Partially known.","The known/unknown register is updated — that is the learning made durable."],
    ["Close","Incident closed with a complete record: detection, decision, evidence, approver and date.","Available to audit without asking five departments."],
  ];
  let ip=0;
  function inc(){
    $('#incSteps').innerHTML=INC.map((s,i)=>`<li class="${i<ip?'done':(i===ip?'now':'')}">${i+1}. ${s[0]}</li>`).join('');
    const s=INC[Math.min(ip,INC.length-1)];
    $('#incOut').innerHTML=`<div class="detail"><h4>${s[0]}</h4><p>${s[1]}</p><p class="small dim" style="margin:0">${s[2]}</p></div>
    <div class="grid2" style="gap:14px;margin-top:14px">
      <div class="readout ${ip>=2?'ok':'bad'}"><b>${ip>=2?'Contained':'Open'}</b><small>containment</small></div>
      <div class="readout"><b>${ip>=8?'Closed':'Active'}</b><small>incident state</small></div>
    </div>${ip>=INC.length-1?`<p class="small dim" style="margin-top:12px">Nine steps, one record. The incident produced a threshold change, a checklist item, a vendor clause and a register update — which is what distinguishes an incident process from an apology.</p>`:''}`;
  }
  $('#incNext').onclick=()=>{ip=Math.min(ip+1,INC.length-1);inc();};
  $('#incReset').onclick=()=>{ip=0;inc();};
  inc();

  /* exec */
  const crit=UC.filter(u=>u.tier==='Critical').length, high=UC.filter(u=>u.tier==='High').length,
        mod=UC.filter(u=>u.tier==='Moderate').length, low=UC.filter(u=>u.tier==='Low').length;
  const unknowns=UC.reduce((a,u)=>a+u.ku.filter(k=>k[1]==='Unknown').length,0);
  $('#execOut').innerHTML=`
  <div class="grid3" style="gap:14px">
    <div class="readout"><b>10</b><small>AI systems registered</small></div>
    <div class="readout bad"><b>${crit}</b><small>Tier 4 · critical</small></div>
    <div class="readout warn"><b>${high}</b><small>Tier 3 · high</small></div>
    <div class="readout"><b>${mod}</b><small>Tier 2 · moderate</small></div>
    <div class="readout warn"><b>${unknowns}</b><small>open unknowns across the portfolio</small></div>
    <div class="readout ok"><b>100%</b><small>systems with a named owner</small></div>
  </div>
  <div class="grid2" style="margin-top:22px">
    <div>
      <h4>Pilot health — Gate 2, 50 branches</h4>
      <div class="ledger tight">
        <div class="row"><b>Response rate</b><span>74% · pass criterion is 70% <span class="dim">— the metric that governs the programme</span></span></div>
        <div class="row"><b>False alarms</b><span>2.6 per branch per week · criterion ≤3</span></div>
        <div class="row"><b>Camera obstruction</b><span>0 instances · the adoption canary</span></div>
        <div class="row"><b>Weak-connectivity uptime</b><span>98.4% · criterion ≥98%</span></div>
        <div class="row"><b>Alerts per branch per day</b><span>4.9 · capped at 8</span></div>
      </div>
      <p class="small dim">Flag-to-action rate is measured at branch level, never at individual level. If it falls, the system is failing regardless of model accuracy.</p>
    </div>
    <div>
      <h4>Governance health</h4>
      <div class="ledger tight">
        <div class="row"><b>Assessments</b><span>10 of 10 complete</span></div>
        <div class="row"><b>Kill switches</b><span>tested this quarter on UC02; scheduled for the rest</span></div>
        <div class="row"><b>Open incidents</b><span>1 · UC02 camera-type false positives · contained</span></div>
        <div class="row"><b>Overdue reviews</b><span>0</span></div>
        <div class="row"><b>Awaiting decision</b><span>Roster access for UC06 · HR and union position outstanding</span></div>
      </div>
      <h4 style="margin-top:22px">Money, against plan</h4>
      <div class="ledger tight">
        <div class="row"><b>Committed</b><span>₹1.16 cr through Gates 1 and 2</span></div>
        <div class="row"><b>Year-one plan</b><span>₹31.17 cr</span></div>
        <div class="row"><b>Largest exposure</b><span>Currency on ₹29 cr of imports — owner not yet named</span></div>
      </div>
    </div>
  </div>`;
}
</script>
</main></body></html>
