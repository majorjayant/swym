    anims.forEach(function(a){try{a.cancel()}catch(e){}});
    root.classList.remove('intro');
    removeEventListener('pointerdown',end,true);removeEventListener('keydown',end,true);
  }
  addEventListener('pointerdown',end,true);addEventListener('keydown',end,true);
  setTimeout(end,2350);
  try{
    var r=box.getBoundingClientRect(),vw=innerWidth,vh=innerHeight,
        s=Math.min(vw*.86,760)/r.width,
        dx=vw/2-(r.left+r.width/2),dy=vh/2-(r.top+r.height/2),
        unit=svg.viewBox.baseVal.width/(r.width*s),out='cubic-bezier(.22,.61,.36,1)',
        start='translate('+dx+'px,'+dy+'px) scale('+s+')';
    function A(el,k,o){if(!el)return;o.fill='both';anims.push(el.animate(k,o))}
    // 1. The car silhouette sweeps in from the left.
    A(q('#car-wipe-rect'),[{transform:'scaleX(0)'},{transform:'scaleX(1)'}],{duration:1000,easing:'ease-out'});
    // 2. Letters fade and rise into place, staggered.
    var L=svg.querySelectorAll('#wordmark .letter');
    for(var i=0;i<L.length;i++)A(L[i],[{opacity:0,transform:'translateY('+8*unit+'px)'},{opacity:1,transform:'none'}],{duration:480,delay:280+i*45,easing:out});
    // 3. Red underline draws, then the tagline settles in.
    A(q('#underline-wipe-rect'),[{transform:'scaleX(0)'},{transform:'scaleX(1)'}],{duration:450,delay:760,easing:'ease-out'});
    A(q('#tagline'),[{opacity:0},{opacity:1}],{duration:400,delay:950,easing:'ease-out'});
    // 4. Hold, then the logo moves to the header as the overlay fades.
    A(box,[{transform:start},{transform:'none'}],{duration:550,delay:1700,easing:'cubic-bezier(.4,0,.2,1)'});
    A(veil,[{opacity:1},{opacity:0}],{duration:450,delay:1800,easing:'ease-out'});
  }catch(e){end()}
})();
</script>
</body>
